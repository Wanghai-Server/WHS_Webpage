name: 功能建议
description: 提议新功能、体验优化，或对现有功能提出改进方案
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先：

        1. 阅读 [贡献指南](https://github.com/Wanghai-Server/WHS_Webpage/blob/main/CONTRIBUTING.md) 与 [README](https://github.com/Wanghai-Server/WHS_Webpage/blob/main/README.md)；
        2. 搜索已有 Issue，确认没有相同建议；
        3. 较大的功能 / 重构 / 依赖升级建议先在此讨论方案，再提交 PR。

        请勿在本模板中填写真实密钥、密码或用户隐私数据。

  - type: textarea
    id: background
    attributes:
      label: 背景与当前痛点
      description: 现在是什么情况？为什么需要这个改动？请描述具体使用场景。
      placeholder: 例如：维基页面超过 20 个标题后，右侧目录太长且无法折叠，阅读长页面时定位困难。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望新增 / 修改什么？交互或接口大致是什么样？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他实现方式或替代做法（可选）。
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 涉及模块
      description: 该建议可能涉及哪些部分？可多选；不确定就选「不确定」。
      multiple: true
      options:
        - 前端（whs/）
        - 后端（backend/）
        - 数据层（data/）
        - MCDR 插件（mcdr_connecter_plugin/）
        - 文档 / CI / 其他
        - 不确定
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考链接、截图、示意图、相关 Issue 等（可选）。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，确认没有相同建议
          required: true
        - label: 我已阅读贡献指南与 README 的相关章节
          required: true
        - label: 内容不包含真实密钥、密码等敏感信息
          required: true
        - label: 如方案确认，我愿意提交 PR
          required: false

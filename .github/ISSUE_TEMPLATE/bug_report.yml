name: Bug 报告
description: 报告一个可复现的问题（前端 / 后端 / 数据层 / MCDR 插件 / 文档）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先：

        1. 阅读 [贡献指南](https://github.com/Wanghai-Server/WHS_Webpage/blob/main/CONTRIBUTING.md) 与 [README](https://github.com/Wanghai-Server/WHS_Webpage/blob/main/README.md)；
        2. 搜索已有 Issue，确认没有重复；
        3. **不要**在 Issue 中填写真实 token、密码、密钥、验证码或用户隐私数据。

        > 安全漏洞请勿公开提交，请私下联系维护者（见 `.github/CODEOWNERS`）。

  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      description: 问题主要出现在哪个部分？
      options:
        - 前端（whs/）
        - 后端（backend/）
        - 数据层（data/）
        - MCDR 插件（mcdr_connecter_plugin/）
        - 文档 / CI / 其他
        - 不确定
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？请尽量具体（页面、接口、操作、报错文本）。
      placeholder: 例如：在消息中心打开一条含表格的消息，表格没有边框，两列宽度比例异常。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序列出最小复现步骤；能稳定复现最好。
      placeholder: |
        1. 启动 python manage.py --dev
        2. 登录后打开 /messages
        3. 点击含表格的消息
        4. 观察表格样式
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望的正确表现是什么？
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      description: 你在什么环境下遇到该问题？
      options:
        - 本地开发（python manage.py --dev）
        - 生产部署（uvicorn + 静态托管 / 反向代理）
        - GitHub Actions CI
        - 其他
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: 版本与环境信息
      description: 前端请填写浏览器 / 系统 / 屏幕宽度 / 界面语言；后端请填写 Python 版本与部署方式；MCDR 相关请填写 MCDR 与插件版本。
      placeholder: 例如：Edge 143 / Windows 11 / 390×844 / 中文；或 Python 3.14.9 / uvicorn 本地
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志、控制台报错或截图
      description: 可粘贴报错文本（请先移除敏感信息），或直接拖拽图片到此处；前端问题可附浏览器 Console / Network 信息。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，确认没有重复问题
          required: true
        - label: 我已阅读贡献指南与 README 的相关章节
          required: true
        - label: 我确认内容不包含真实密钥、token、密码等敏感信息
          required: true
